# Include inside the existing HTTPS server block. Selfie keeps its own upstream.
location ^~ /v1/archive/ {
    proxy_pass http://127.0.0.1:8089;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    client_max_body_size 8m;
    # Download query strings contain short-lived tickets.
    access_log off;
}
