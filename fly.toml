# fly.toml app configuration file generated for invoice-web-v2 on 2026-08-14T10:51:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "invoice-web-v2"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Production must use the existing Supabase database. The app fails fast if
  # SUPABASE_DB_URL/DATABASE_URL is missing instead of silently creating SQLite.
  DATABASE_DRIVER = "postgres"
  SQLITE_PATH = "/data/sqlite.db"
  UPLOAD_DIR = "/data/uploads/proofs"
  STATIC_DIR = "/app/client/dist"
  # Set this to the final public Fly hostname after `fly apps create`.
  ALLOWED_ORIGINS = "https://invoice-web-v2.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/healthz', timeout = '5s' }]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "invoice_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
