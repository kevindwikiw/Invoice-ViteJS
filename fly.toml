app = "invoice-web-v2"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SQLITE_PATH = "/data/sqlite.db"
  UPLOAD_DIR = "/data/uploads/proofs"
  STATIC_DIR = "/app/client/dist"
  # Set this to the final public Fly hostname after `fly apps create`.
  ALLOWED_ORIGINS = "https://invoice-web-v2.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "invoice_data"
  destination = "/data"
  initial_size = "1gb"
